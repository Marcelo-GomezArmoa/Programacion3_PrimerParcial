<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store | Carrito</title>
  <link rel="stylesheet" href="../store.css" />
</head>

<body>
  <div class="store-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Mi carrito</h1>
        <p>Revisa tu seleccion antes de finalizar la compra</p>
      </div>
      <nav class="nav-links">
        <a class="pill-link" href="../home/home.html">Seguir comprando</a>
      </nav>
    </header>

    <main class="cart-layout">
      <section class="panel cart-products-panel">
        <div id="cartContent"></div>
      </section>

      <aside class="panel summary-panel">
        <h2>Resumen</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalValue">$0</span>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="totalValue">$0</span>
        </div>
        <button id="checkoutButton" class="summary-action primary-action" type="button">
          Finalizar compra
        </button>
        <p id="checkoutMessage" class="summary-note">
          El checkout no esta disponible en esta version.
        </p>
        <button id="clearCartButton" class="summary-action secondary-action" type="button">
          Vaciar carrito
        </button>
      </aside>
    </main>
  </div>

  <script type="module" src="./cart.ts"></script>
</body>

</html>
